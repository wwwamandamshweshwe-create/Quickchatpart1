name: Java CI with Ant

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download test and JSON dependencies
        run: |
          mkdir -p lib
          curl -fsSL -o lib/junit-4.13.2.jar      https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -fsSL -o lib/hamcrest-core-1.3.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
          curl -fsSL -o lib/gson-2.10.1.jar       https://repo1.maven.org/maven2/com/google/code/gson/gson/2.10.1/gson-2.10.1.jar
          curl -fsSL -o lib/json.jar              https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar

      - name: Run tests with Ant
        working-directory: QuickChat
        run: |
          ant clean test \
            -Dlibs.junit_4.classpath=../lib/junit-4.13.2.jar \
            -Dlibs.junit_5.classpath=../lib/junit-4.13.2.jar \
            -Dlibs.hamcrest.classpath=../lib/hamcrest-core-1.3.jar \
            -Dfile.reference.gson-2.10.1.jar=../lib/gson-2.10.1.jar \
            -Dfile.reference.json-20250517.jar=../lib/json.jar \
            -Djavac.source=17 \
            -Djavac.target=17

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: QuickChat/build/test/results
